version: "3.8"

networks:
  mlops-net:
    driver: bridge

volumes:
  prometheus_data: {}
  grafana_data: {}
  mlflow_data: {}

services:
  # 1. FastAPI Model Serving Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: house_price_api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MODEL_PATH=models/best_model.joblib
      - MODEL_INFO_PATH=models/model_info.json
      - CONFIG_PATH=configs/config.yaml
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - mlops-net
    restart: unless-stopped

  # 2. Streamlit Interactive Web Application
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: house_price_streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    depends_on:
      - api
    volumes:
      - ./reports:/app/reports
    networks:
      - mlops-net
    restart: unless-stopped

  # 3. MLflow Experiment Tracking Server
  mlflow:
    image: python:3.11-slim
    container_name: house_price_mlflow
    command: >
      bash -c "pip install --no-cache-dir mlflow &&
               mlflow server --backend-store-uri sqlite:////app/mlflow.db
                             --default-artifact-root /app/mlruns
                             --host 0.0.0.0 --port 5000"
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    networks:
      - mlops-net
    restart: unless-stopped

  # 4. Prometheus Monitoring Metrics Collector
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: house_price_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - mlops-net
    restart: unless-stopped

  # 5. Grafana Visualization & Observability Dashboard
  grafana:
    image: grafana/grafana:10.2.0
    container_name: house_price_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - mlops-net
    restart: unless-stopped
