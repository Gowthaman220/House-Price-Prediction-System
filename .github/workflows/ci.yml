name: MLOps Continuous Integration Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black ruff

      - name: Lint Code with Ruff
        run: |
          ruff check . --ignore E501,F401,E402

      - name: Syntax and Import Check
        run: |
          python -m py_compile src/data/*.py src/features/*.py src/models/*.py api/*.py app/*.py

  test-ml-pipeline:
    name: ML Pipeline & Automated Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: 1. Run Data Ingestion Stage
        run: |
          python -m src.data.ingestion

      - name: 2. Run Data Validation Stage
        run: |
          python -m src.data.validation

      - name: 3. Run Preprocessing & Splitting Stage
        run: |
          python -m src.features.preprocessing

      - name: 4. Run Model Training & MLflow Tracking Stage
        run: |
          python -m src.models.train

      - name: 5. Run Model Evaluation Stage
        run: |
          python -m src.models.evaluate

      - name: 6. Run Pytest Suite
        run: |
          python -m pytest -v

  docker-build-verification:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: test-ml-pipeline
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Unified Docker Image
        run: |
          docker build -t house-price-mlops:latest .

      - name: Build Dedicated API Docker Image
        run: |
          docker build -f Dockerfile.api -t house-price-api:latest .

      - name: Build Dedicated Streamlit Docker Image
        run: |
          docker build -f Dockerfile.streamlit -t house-price-streamlit:latest .
